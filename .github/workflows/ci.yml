name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint app components lib scripts

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/en > /dev/null && break
            sleep 2
          done
          pnpm smoke
